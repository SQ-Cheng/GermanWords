<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>德语单词记忆助手 4.2.0-beta.2</title>
    <script src="../../shared/theme.js"></script>
    <script src="../../shared/playback.js"></script>
    <script src="../../shared/vocabulary.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <!-- 4.0：不再依赖外部 CDN，Excel 读取已内置，断网也能用 -->
    <link rel="stylesheet" href="windows.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>🇩🇪 德语单词记忆助手</h2>
      <div class="sidebar-desc">v4.2.0-beta.2 · 断网也能用</div>

      <div class="btn-group">
        <label for="folderInput" class="upload-btn" title="选择整个文件夹">
          📂 导入文件夹
        </label>
        <input
          type="file"
          id="folderInput"
          webkitdirectory
          directory
          multiple
        />

        <label
          for="fileInput"
          class="upload-btn secondary"
          title="如果文件夹无法使用，请用这个"
        >
          📄 导入单个文件
        </label>
        <input type="file" id="fileInput" multiple accept=".xlsx" />
      </div>

      <button id="mixBooks" class="mix-button" onclick="loadSelectedBooks()" disabled>混合学习</button>
      <ul id="fileList" class="file-list">
        <li
          style="
            padding: 20px;
            text-align: center;
            color: #ccc;
            font-size: 0.9em;
          "
        >
          ← 请点击上方按钮<br />开始背单词
        </li>
      </ul>

      <label class="theme-setting" for="playbackRate">语速<select id="playbackRate" onchange="changePlaybackRate(this.value)"><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label>
      <label class="theme-setting" for="themeSelect">主题<select id="themeSelect" onchange="AppTheme.setMode(this.value)"><option value="auto">跟随系统</option><option value="light">昼间</option><option value="dark">夜间</option></select></label>
      <p class="sidebar-status">更新：通过包内 GermanWords.cmd 启动；手动检查使用 Check updates.cmd。</p>
      <div class="shortcut-hint">
        <strong>⌨️ 快捷键说明：</strong><br />
        <span class="key">2</span> 上一个<br />
        <span class="key">4</span> 下一个<br />
        <span class="key">Q</span> 显示/隐藏答案<br />
        <span class="key">Space</span> 标记星标
      </div>
      <div class="sidebar-status" id="sidebarStatus"></div>
    </div>

    <div class="main-content">
      <div class="top-bar">
        <input id="wordSearch" type="search" placeholder="搜索德语 / 中文" aria-label="搜索当前学习范围中的单词" oninput="searchWords(this.value)" />
        <select id="modeSelect" class="mode-select" onchange="changeMode()">
          <option value="normal">📖 普通模式</option>
          <option value="test-zh">🇨🇳 中文自测</option>
          <option value="test-de">🇩🇪 德语自测</option>
        </select>

        <button id="btnShuffle" onclick="shuffleCurrentList()">🔀 乱序</button>

        <div
          style="width: 1px; height: 20px; background: #ddd; margin: 0 10px"
        ></div>

        <button id="btnCardView" class="active" onclick="switchView('card')">
          卡片
        </button>
        <button id="btnListView" onclick="switchView('list')">列表</button>

        <div style="flex: 1"></div>
        <button id="btnFilter" onclick="toggleFilter()">只看星标 (0)</button>
      </div>

      <div id="app-container">
        <div id="cardViewContainer" class="card-wrapper" style="display: none">
          <button
            id="btnPrevCard"
            class="nav-btn"
            onclick="prevCard()"
            title="上一个（← 或 2）"
          >
            ‹
          </button>
          <div id="cardView" class="card bg-other" onclick="toggleReveal()">
            <div
              class="star-mark"
              onclick="event.stopPropagation(); toggleCurrentMark()"
            >
              ★
            </div>

            <div id="germanArea" class="card-content-area">
              <div class="card-german" id="cardGerman">Willkommen</div>
            </div>

            <span
              id="pronounceIcon"
              class="pronounce-icon"
              style="display: none; cursor: pointer"
            >
              🔊
            </span>

            <div id="chineseArea" class="card-content-area">
              <div class="card-chinese" id="cardChinese"></div>
            </div>

            <div id="metaArea" class="card-content-area">
              <div class="card-tags">
                <span class="tag" id="cardType">Type</span>
                <span
                  class="tag"
                  id="cardGender"
                  style="display: none; font-weight: bold"
                ></span>
              </div>
              <div class="card-plural" id="cardPlural"></div>
            </div>

            <div id="exampleArea" class="card-content-area">
              <div class="card-example" id="cardExample"></div>
            </div>

            <div class="hint-text" id="clickHint">点击卡片或按 Q 显示答案</div>
            <div class="counter-info" id="cardIndexInfo"></div>
          </div>
          <button
            id="btnNextCard"
            class="nav-btn"
            onclick="nextCard()"
            title="下一个（→ 或 4）"
          >
            ›
          </button>
        </div>

        <div
          id="listViewContainer"
          class="list-view-container"
          style="display: none"
        >
          <div class="table-scroll">
            <table id="wordTable">
              <thead>
                <tr>
                  <th style="width: 20%">德语</th>
                  <th style="width: 15%">中文</th>
                  <th style="width: 10%">词性</th>
                  <th style="width: 10%">复数</th>
                  <th style="width: 27%">例句</th>
                  <th style="width: 18%">操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">👈</div>
          <h3>请选择左侧的一个文件</h3>
          <p>
            词表（.xlsx）和音频都在 words 文件夹里<br />点「导入文件夹」选中它即可开始
          </p>
        </div>
      </div>
    </div>

    <div id="notice" class="notice"></div>

    <script src="../../shared/parser.js"></script>
    <script src="../../shared/audio.js"></script><script src="../../shared/marks.js"></script>
    <script src="app.js"></script>
  </body>
</html>
